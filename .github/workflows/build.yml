name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build release archive
        shell: pwsh
        run: ./build-release.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: LegionGo2ControllerBridge-win-x64
          path: |
            artifacts/LegionGo2ControllerBridge-win-x64.zip
            artifacts/LegionGo2ControllerBridge-win-x64.zip.sha256
          if-no-files-found: error

      - name: Attest release archive provenance
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: artifacts/LegionGo2ControllerBridge-win-x64.zip
